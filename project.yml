name: mdviewer
options:
  bundleIdPrefix: local
  deploymentTarget:
    macOS: "15.0"
packages:
  cmark-gfm:
    url: https://github.com/swiftlang/swift-cmark
    from: 0.9.0
targets:
  mdviewer:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        excludes: [Info.plist]
    dependencies:
      - package: cmark-gfm
        product: cmark-gfm
      - package: cmark-gfm
        product: cmark-gfm-extensions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.mdviewer
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Resources/mdviewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Outgoing connections are only used for "Check for Updates…" (GitHub Releases).
        # Documents are kept offline by WebKit content-blocking rules and a CSP.
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        # Read-only access to files next to the document (relative images, file watching).
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
        com.apple.security.print: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: mdviewer
        MDVUpdateRepository: xjmzx/mdviewer
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd, mkdn]
              public.mime-type: [text/markdown]
